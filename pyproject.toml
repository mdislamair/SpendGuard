[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spendguard"
version = "0.1.0"
description = "Budget guard for AI coding spend: report usage, enforce daily/weekly/monthly limits, block over-budget prompts, fail CI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "claude-code", "cost", "budget", "llm", "tokens", "finops"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
]
dependencies = []

[project.scripts]
spendguard = "spendguard.cli:main"

[tool.setuptools]
packages = ["spendguard"]
